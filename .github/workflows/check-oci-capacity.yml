name: OCI Capacity Monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-capacity-monitor
  cancel-in-progress: true

jobs:
  check-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install \
            --quiet \
            --disable-pip-version-check \
            oci-cli

      - name: Configure OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.oci"

          printf '%s\nOCI_API_KEY\n' "$OCI_PRIVATE_KEY" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=ap-osaka-1
          EOF

          chmod 600 "$HOME/.oci/config"

      - name: Create shape configuration
        run: |
          cat > shape-availabilities.json <<'EOF'
          [
            {
              "instanceShape": "VM.Standard.A1.Flex",
              "instanceShapeConfig": {
                "ocpus": 1,
                "memoryInGBs": 6
              }
            },
            {
              "instanceShape": "VM.Standard.A2.Flex",
              "instanceShapeConfig": {
                "ocpus": 1,
                "memoryInGBs": 4
              }
            }
          ]
          EOF

      - name: Check OCI capacity
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
        run: |
          oci compute compute-capacity-report create \
            --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --shape-availabilities file://shape-availabilities.json \
            --region ap-osaka-1 \
            > report.json

          echo "Capacity Report:"
          jq -r '
            .data."shape-availabilities"[]
            | "\(.["instance-shape"]): \(.["availability-status"]) (available-count=\(.["available-count"] // 0))"
          ' report.json

      - name: Notify Discord if available
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          AVAILABLE_COUNT=$(
            jq '
              [
                .data."shape-availabilities"[]
                | select(.["availability-status"] == "AVAILABLE")
              ]
              | length
            ' report.json
          )

          if [ "$AVAILABLE_COUNT" -eq 0 ]; then
            echo "No OCI capacity available."
            exit 0
          fi

          AVAILABLE_SHAPES=$(
            jq -r '
              .data."shape-availabilities"[]
              | select(.["availability-status"] == "AVAILABLE")
              | "• \(.["instance-shape"]) (available-count=\(.["available-count"] // 0))"
            ' report.json
          )

          MESSAGE=$(printf \
            '🚨 OCI Compute に空きが出ました！\n\n%s\n\nOCI Consoleから早めにインスタンスを作成してください。' \
            "$AVAILABLE_SHAPES"
          )

          PAYLOAD=$(
            jq -n \
              --arg content "$MESSAGE" \
              '{content: $content}'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
